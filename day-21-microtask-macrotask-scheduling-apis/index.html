<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Day 21 — Microtask & Macrotask Scheduling APIs</title>
  <style>
    body { font-family: ui-monospace, Consolas, monospace; background: #0d1117; color: #c9d1d9; padding: 2rem; line-height: 1.5; }
    h1 { color: #58a6ff; font-size: 1.1rem; }
    p.hint { color: #8b949e; }
    #output { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; white-space: pre-wrap; margin-top: 1rem; min-height: 2rem; }
    .log-line { border-bottom: 1px dashed #21262d; padding: 2px 0; }
  </style>
</head>
<body>
  <h1>Day 21 — Microtask & Macrotask Scheduling APIs</h1>
  <p class="hint">Open DevTools Console (F12) to see full output, or read it rendered below.</p>
  <div id="output"></div>

  <script>
    // Mirror console.log into the page so the exercise is viewable without DevTools.
    const outputEl = document.getElementById('output');
    const originalLog = console.log;
    console.log = (...args) => {
      originalLog(...args);
      const line = document.createElement('div');
      line.className = 'log-line';
      line.textContent = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
      outputEl.appendChild(line);
    };
  </script>
  <script src="script.js"></script>
</body>
</html>
